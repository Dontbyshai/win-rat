server {
    listen 8801;
    server_name _;

    root /var/www/win-rat/server/backend/dist;
    index index.html;

    # Sert le frontend React (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sert les fichiers uploadés (helper.exe, etc.) directement depuis Laravel public/
    location /uploads/ {
        alias /var/www/win-rat/server/backend/public/uploads/;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Proxy vers le backend Laravel sur le port 8800
    location /api/ {
        proxy_pass http://127.0.0.1:8800;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;
}
