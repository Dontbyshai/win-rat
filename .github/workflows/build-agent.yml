name: Build Windows Agent

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'agent/**'
      - '.github/workflows/build-agent.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore packages.config packages (Fody, AForge, etc.)
        run: .\nuget.exe install agent\packages.config -OutputDirectory packages

      - name: Restore PackageReference packages
        working-directory: agent
        run: ..\nuget.exe restore C2Client.sln -PackagesDirectory ..\packages

      - name: Verify Fody exists
        shell: pwsh
        run: |
          $fody = Get-ChildItem -Path "packages" -Recurse -Filter "Fody.targets" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($fody) {
            Write-Host "✅ Fody.targets found at: $($fody.FullName)"
          } else {
            Write-Host "❌ Fody.targets NOT found"
            Write-Host "packages\ contents:"
            Get-ChildItem packages | Select-Object Name
            exit 1
          }

      - name: Build Release
        working-directory: agent
        run: msbuild C2Client.sln /p:Configuration=Release /p:Platform="Any CPU" /v:minimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: C2Client-Release
          path: agent\bin\Release\
          retention-days: 30
