name: Build Windows Agent

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'agent/**'
      - '.github/workflows/build-agent.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        working-directory: agent
        run: nuget restore C2Client.sln -PackagesDirectory ..\packages

      - name: Verify Fody package
        shell: pwsh
        run: |
          $path = "packages\Fody.6.8.2\build\Fody.targets"
          if (Test-Path $path) {
            Write-Host "OK: Fody.targets found at $path"
          } else {
            Write-Host "ERROR: Fody.targets NOT found!"
            if (Test-Path "packages") {
              Write-Host "Contents of packages\:"
              Get-ChildItem packages\ | Select-Object Name
            } else {
              Write-Host "packages\ directory does not exist!"
            }
            exit 1
          }

      - name: Build Release
        working-directory: agent
        run: |
          msbuild C2Client.sln `
            /p:Configuration=Release `
            /p:Platform="Any CPU" `
            /v:minimal

      - name: Upload artifact (exe)
        uses: actions/upload-artifact@v4
        with:
          name: C2Client-Release
          path: agent\bin\Release\
          retention-days: 30
