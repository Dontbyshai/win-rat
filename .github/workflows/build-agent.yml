name: Build Windows Agent

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'agent/**'
      - '.github/workflows/build-agent.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        working-directory: agent
        run: ..\nuget.exe restore C2Client.sln -PackagesDirectory ..\packages

      - name: Verify packages restored
        shell: pwsh
        run: |
          $fody = "packages\Fody.6.8.2\build\Fody.targets"
          if (Test-Path $fody) {
            Write-Host "✅ Fody.targets found"
          } else {
            Write-Host "❌ NOT found: $fody"
            Write-Host "Contents of packages\:"
            if (Test-Path "packages") { Get-ChildItem packages | Select Name }
            else { Write-Host "packages\ folder does not exist" }
            exit 1
          }

      - name: Build Release
        working-directory: agent
        run: ..\nuget.exe restore C2Client.sln -PackagesDirectory ..\packages; msbuild C2Client.sln /p:Configuration=Release /p:Platform="Any CPU" /v:minimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: C2Client-Release
          path: agent\bin\Release\
          retention-days: 30
