name: Build Windows Agent

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'agent/**'
  workflow_dispatch:  # Permet de lancer manuellement depuis GitHub

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore agent\C2Client.sln

      - name: Build Release
        run: msbuild agent\C2Client.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Upload artifact (exe)
        uses: actions/upload-artifact@v4
        with:
          name: C2Client-Release
          path: agent\bin\Release\
          retention-days: 30
